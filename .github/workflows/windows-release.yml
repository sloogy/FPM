name: Cross-platform gated release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: fpm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Gate and build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            lock_file: constraints-windows.lock
            artifact_name: FountainPenManager-windows
          - os: ubuntu-latest
            platform: linux
            lock_file: constraints-linux.lock
            artifact_name: FountainPenManager-linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require and validate platform lock
        shell: bash
        run: |
          test -f "${{ matrix.lock_file }}"
          python tools/gen_lockfile.py --check --platform "${{ matrix.platform }}"

      - name: Validate production or release-candidate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python tools/release_metadata.py --validate-tag "$GITHUB_REF_NAME"

      - name: Install hash-locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r "${{ matrix.lock_file }}"

      - name: Run complete release gates
        shell: bash
        run: |
          python tools/sync_version.py --check
          python tools/check_windows_paths.py
          python tools/import_smoke.py
          python tools/name_audit.py
          python tools/exception_audit.py
          python tools/db_access_audit.py
          python -m compileall -q .
          python -m ruff check . --select E9,F63,F7,F82
          python -m bandit -q -r database logic ui updater main.py tools -x tests --severity-level medium
          python -m pytest -q --cov=logic --cov=database --cov=updater --cov-report=term --cov-fail-under=65
          python -m pytest -q tests/test_updater_behavior_0301.py tests/test_updater_enterprise_0304.py --cov=updater.check_update --cov=updater.apply_update --cov=updater.startup_check --cov-report=term --cov-fail-under=85
          python tools/gui_smoke_test.py
          python tools/i18n_audit.py
          python tools/i18n_quality_audit.py
          python tools/i18n_key_wiring_audit.py
          python tools/i18n_runtime_audit.py
          python tools/i18n_visible_text_audit.py
          python tools/killcritic_1000_loop_audit.py

      - name: Build with PyInstaller
        shell: bash
        run: python -m PyInstaller FPM.spec --noconfirm --clean

      - name: Require signing credentials for tagged Windows releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PASSWORD) {
            throw "Tagged releases require WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD."
          }

      - name: Sign and verify Windows application
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "fpm-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:CERT_PASSWORD "dist\FountainPenManager\FountainPenManager.exe"
          if ($LASTEXITCODE -ne 0) { throw "Application signing failed" }
          & $signtool.FullName verify /pa /all /v "dist\FountainPenManager\FountainPenManager.exe"
          if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed" }
          Remove-Item -Force $pfx

      - name: Validate onedir output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/FountainPenManager")
          assert root.is_dir()
          assert (root / "_internal").is_dir()
          assert (root / ("FountainPenManager.exe" if "${{ matrix.platform }}" == "windows" else "FountainPenManager")).is_file()
          print(*sorted(p.name for p in root.iterdir()), sep="\n")
          PY

      - name: Mark unsigned release-candidate artifacts
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.')
        shell: bash
        run: |
          echo "### Unsigned release candidate: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "These artifacts are unsigned and may only be published as a clearly marked GitHub Prerelease." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onedir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FountainPenManager
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Build and sign Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows onedir artifact
        uses: actions/download-artifact@v4
        with:
          name: FountainPenManager-windows
          path: dist/FountainPenManager

      - name: Validate installer input
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FountainPenManager\FountainPenManager.exe")) { throw "FountainPenManager.exe missing" }
          if (-not (Test-Path "dist\FountainPenManager\_internal")) { throw "_internal missing" }

      - name: Re-verify downloaded application signature
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName verify /pa /all /v "dist\FountainPenManager\FountainPenManager.exe"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded application signature verification failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "installer\FountainPenManager_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          $setup = Get-ChildItem release -Filter "FountainPenManager_Setup_*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "Installer not generated" }
          Copy-Item -Force $setup.FullName "FountainPenManager_Setup.exe"

      - name: Require signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64 -or -not $env:CERT_PASSWORD) { throw "Signing credentials missing" }

      - name: Sign and verify installer
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "fpm-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:CERT_PASSWORD "FountainPenManager_Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
          & $signtool.FullName verify /pa /all /v "FountainPenManager_Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed" }
          Remove-Item -Force $pfx

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FountainPenManager-installer
          path: FountainPenManager_Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged prerelease or verified signed release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: ${{ contains(github.ref_name, '-rc.') && 'prerelease' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require and install hash-locked release dependencies
        shell: bash
        run: |
          test -f constraints-linux.lock
          python tools/gen_lockfile.py --check --platform linux
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r constraints-linux.lock

      - name: Derive synchronized release metadata
        shell: bash
        run: |
          python tools/sync_version.py --check
          python tools/release_metadata.py --github-env "$GITHUB_ENV"

      - name: Require exact tag/version match and module signing key
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          test "${GITHUB_REF_NAME}" = "${FPM_RELEASE_TAG}"
          test -n "${LIFEPLANNER_UPDATE_PRIVATE_KEY_B64}"

      - name: Download Windows runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: FountainPenManager-windows
          path: artifacts/windows

      - name: Download Linux runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: FountainPenManager-linux
          path: artifacts/linux

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FountainPenManager-installer
          path: artifacts/installer

      - name: Sign and verify already-gated runtime artifacts
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          WIN_RUNTIME="$(python tools/runtime_artifact.py locate --search-root artifacts/windows --binary FountainPenManager.exe)"
          LINUX_RUNTIME="$(python tools/runtime_artifact.py locate --search-root artifacts/linux --binary FountainPenManager)"
          echo "FPM_WIN_RUNTIME=${WIN_RUNTIME}" >> "$GITHUB_ENV"
          echo "FPM_LINUX_RUNTIME=${LINUX_RUNTIME}" >> "$GITHUB_ENV"
          mkdir -p release_attestations
          python tools/runtime_artifact.py sign \
            --runtime-dir "$WIN_RUNTIME" \
            --platform windows-x86_64 \
            --manifest release_attestations/windows-runtime.json \
            --signature release_attestations/windows-runtime.json.sig \
            --public-key-out release_attestations/release-public-key.b64
          python tools/runtime_artifact.py sign \
            --runtime-dir "$LINUX_RUNTIME" \
            --platform linux-x86_64 \
            --manifest release_attestations/linux-runtime.json \
            --signature release_attestations/linux-runtime.json.sig \
            --public-key-out release_attestations/release-public-key.b64
          python tools/runtime_artifact.py verify \
            --runtime-dir "$WIN_RUNTIME" \
            --platform windows-x86_64 \
            --manifest release_attestations/windows-runtime.json \
            --signature release_attestations/windows-runtime.json.sig \
            --public-key-file release_attestations/release-public-key.b64
          python tools/runtime_artifact.py verify \
            --runtime-dir "$LINUX_RUNTIME" \
            --platform linux-x86_64 \
            --manifest release_attestations/linux-runtime.json \
            --signature release_attestations/linux-runtime.json.sig \
            --public-key-file release_attestations/release-public-key.b64

      - name: Build LifePlanner modules only from signed runtime artifacts
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          LIFEPLANNER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.LIFEPLANNER_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p modules
          python tools/build_lifeplanner_module.py \
            --runtime-dir "$FPM_WIN_RUNTIME" \
            --runtime-name FountainPenManager \
            --platform windows-x86_64 \
            --artifact-manifest release_attestations/windows-runtime.json \
            --artifact-signature release_attestations/windows-runtime.json.sig \
            --public-key-file release_attestations/release-public-key.b64 \
            --output-dir modules
          python tools/build_lifeplanner_module.py \
            --runtime-dir "$FPM_LINUX_RUNTIME" \
            --runtime-name FountainPenManager \
            --platform linux-x86_64 \
            --artifact-manifest release_attestations/linux-runtime.json \
            --artifact-signature release_attestations/linux-runtime.json.sig \
            --public-key-file release_attestations/release-public-key.b64 \
            --output-dir modules
          test -f "modules/${FPM_MODULE_WINDOWS}"
          test -f "modules/${FPM_MODULE_LINUX}"

      - name: Verify and host-install both module artifacts
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/lifeplanner_host_contract.py "modules/${FPM_MODULE_WINDOWS}" \
            --public-key-file release_attestations/release-public-key.b64 \
            --platform windows-x86_64 --id fpm --version "$FPM_APP_VERSION" \
            --install-root host_install/windows
          python tools/lifeplanner_host_contract.py "modules/${FPM_MODULE_LINUX}" \
            --public-key-file release_attestations/release-public-key.b64 \
            --platform linux-x86_64 --id fpm --version "$FPM_APP_VERSION" \
            --install-root host_install/linux
          test -f "host_install/windows/fpm/${FPM_APP_VERSION}/FountainPenManager/FountainPenManager.exe"
          test -f "host_install/linux/fpm/${FPM_APP_VERSION}/FountainPenManager/FountainPenManager"

      - name: Build one complete release asset set and updater manifest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${FPM_RELEASE_TAG}"
          python tools/build_release_assets.py \
            --version "$FPM_APP_VERSION" \
            --release-tag "$FPM_RELEASE_TAG" \
            --base-url "$BASE" \
            --windows-build-dir "$FPM_WIN_RUNTIME" \
            --linux-build-dir "$FPM_LINUX_RUNTIME" \
            --installer-dir artifacts/installer \
            --module-windows "modules/${FPM_MODULE_WINDOWS}" \
            --module-linux "modules/${FPM_MODULE_LINUX}" \
            --out-dir release_assets

      - name: Verify final release assets, checksums and manifest names
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release_assets && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path("release_assets")
          manifest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == os.environ["FPM_APP_VERSION"]
          assert manifest["release_tag"] == os.environ["FPM_RELEASE_TAG"]
          assets = manifest["assets"]
          assert assets["windows"]["type"] == "portable-zip"
          assert assets["linux"]["type"] == "portable-zip"
          assert assets["windows_installer"]["type"] == "installer"
          assert assets["lifeplanner_windows"]["url"].endswith(os.environ["FPM_MODULE_WINDOWS"])
          assert assets["lifeplanner_linux"]["url"].endswith(os.environ["FPM_MODULE_LINUX"])
          for name in (os.environ["FPM_MODULE_WINDOWS"], os.environ["FPM_MODULE_LINUX"]):
              with zipfile.ZipFile(root / name) as archive:
                  names = set(archive.namelist())
                  assert {"component.json", "component.json.sig", "payload/module.json"} <= names
          PY

      - name: Build unsigned LifePlanner prerelease modules from gated runtimes
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: |
          set -euo pipefail
          WIN_RUNTIME="$(python tools/runtime_artifact.py locate --search-root artifacts/windows --binary FountainPenManager.exe)"
          LINUX_RUNTIME="$(python tools/runtime_artifact.py locate --search-root artifacts/linux --binary FountainPenManager)"
          echo "FPM_WIN_RUNTIME=${WIN_RUNTIME}" >> "$GITHUB_ENV"
          echo "FPM_LINUX_RUNTIME=${LINUX_RUNTIME}" >> "$GITHUB_ENV"
          mkdir -p modules
          python tools/build_lifeplanner_module.py \
            --runtime-dir "$WIN_RUNTIME" \
            --runtime-name FountainPenManager \
            --platform windows-x86_64 \
            --unsigned-prerelease-tag "$GITHUB_REF_NAME" \
            --output-dir modules
          python tools/build_lifeplanner_module.py \
            --runtime-dir "$LINUX_RUNTIME" \
            --runtime-name FountainPenManager \
            --platform linux-x86_64 \
            --unsigned-prerelease-tag "$GITHUB_REF_NAME" \
            --output-dir modules
          test -f "modules/${FPM_MODULE_WINDOWS}"
          test -f "modules/${FPM_MODULE_LINUX}"

      - name: Verify and host-install unsigned prerelease modules
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: |
          set -euo pipefail
          python tools/lifeplanner_host_contract.py "modules/${FPM_MODULE_WINDOWS}" \
            --allow-unsigned \
            --platform windows-x86_64 --id fpm --version "$FPM_APP_VERSION" \
            --install-root host_install/windows
          python tools/lifeplanner_host_contract.py "modules/${FPM_MODULE_LINUX}" \
            --allow-unsigned \
            --platform linux-x86_64 --id fpm --version "$FPM_APP_VERSION" \
            --install-root host_install/linux
          test -f "host_install/windows/fpm/${FPM_APP_VERSION}/FountainPenManager/FountainPenManager.exe"
          test -f "host_install/linux/fpm/${FPM_APP_VERSION}/FountainPenManager/FountainPenManager"

      - name: Build clearly marked unsigned prerelease assets
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: |
          python tools/release_metadata.py --validate-tag "$GITHUB_REF_NAME"
          python tools/build_release_assets.py \
            --prerelease \
            --version "$FPM_APP_VERSION" \
            --release-tag "$GITHUB_REF_NAME" \
            --windows-build-dir "$FPM_WIN_RUNTIME" \
            --linux-build-dir "$FPM_LINUX_RUNTIME" \
            --installer-dir artifacts/installer \
            --module-windows "modules/${FPM_MODULE_WINDOWS}" \
            --module-linux "modules/${FPM_MODULE_LINUX}" \
            --out-dir prerelease_assets

      - name: Verify unsigned prerelease checksums and warning
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: |
          set -euo pipefail
          test -f prerelease_assets/UNSIGNED_PRERELEASE.txt
          test ! -f prerelease_assets/latest.json
          (cd prerelease_assets && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path("prerelease_assets")
          for name in (os.environ["FPM_MODULE_WINDOWS"], os.environ["FPM_MODULE_LINUX"]):
              with zipfile.ZipFile(root / name) as archive:
                  names = set(archive.namelist())
                  assert {"component.json", "payload/module.json"} <= names
                  assert "component.json.sig" not in names
          PY

      - name: Upload combined tagged artifact
        uses: actions/upload-artifact@v4
        with:
          name: fountainpen-manager-${{ github.ref_name }}
          path: |
            release_assets/*
            prerelease_assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release or Prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "$FPM_RELEASE_TAG" ]]; then
            asset_dir="release_assets"
            title="FountainPenManager $FPM_RELEASE_TAG"
            release_flags=(--generate-notes)
          else
            asset_dir="prerelease_assets"
            title="FountainPenManager $GITHUB_REF_NAME — UNSIGNED TEST BUILD"
            release_flags=(--prerelease --notes "Unsigned Windows/Linux test build including unsigned LifePlanner .lpmodule packages. Local module installation requires explicit trust confirmation. Not for production use.")
          fi
          gh release create "$GITHUB_REF_NAME" "$asset_dir"/* \
            --verify-tag --title "$title" "${release_flags[@]}"
