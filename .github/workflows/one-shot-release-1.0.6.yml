name: Verify FPM 1.0.6 release

on:
  push:
    branches:
      - fix/onboarding-theme-1.0.6
    paths-ignore:
      - '.release/v1.0.6-release-status.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: fpm-verify-release-1.0.6
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the gated v1.0.6 release run and record result
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 73965fcd01a9b5d2dfd268853b538340d4c8dfae
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow windows-release.yml --limit 40 --json databaseId,headSha,event --jq '.[] | select(.headSha == env.EXPECTED_SHA and .event == "workflow_dispatch") | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          mkdir -p .release
          if [ -z "$run_id" ]; then
            printf 'status=missing\nversion=1.0.6\nsha=%s\n' "$EXPECTED_SHA" > .release/v1.0.6-release-status.txt
          else
            set +e
            gh run watch "$run_id" --exit-status --interval 10
            watch_rc=$?
            set -e
            conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion // "unknown"')"
            status="$(gh run view "$run_id" --json status --jq '.status // "unknown"')"
            url="$(gh run view "$run_id" --json url --jq '.url // ""')"
            printf 'status=%s\nconclusion=%s\nrun_id=%s\nversion=1.0.6\nsha=%s\nurl=%s\nwatch_rc=%s\n' \
              "$status" "$conclusion" "$run_id" "$EXPECTED_SHA" "$url" "$watch_rc" \
              > .release/v1.0.6-release-status.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .release/v1.0.6-release-status.txt
          git commit -m "Record FPM v1.0.6 release result"
          git push origin HEAD:fix/onboarding-theme-1.0.6
