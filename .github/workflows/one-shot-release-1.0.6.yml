name: Promote corrected FPM 1.0.7 release

on:
  push:
    branches:
      - fix/onboarding-theme-1.0.6
    paths-ignore:
      - '.release/v1.0.7-release-status.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: fpm-promote-1.0.7
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_BASE_SHA: 73965fcd01a9b5d2dfd268853b538340d4c8dfae

jobs:
  validate:
    name: Pre-release gates ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            lock_file: constraints-windows.lock
          - os: ubuntu-latest
            platform: linux
            lock_file: constraints-linux.lock
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize corrected 1.0.7 candidate from exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          p = Path("app_info.py")
          text = p.read_text(encoding="utf-8")
          assert text.count('APP_VERSION = "1.0.6"') == 1
          assert text.count('APP_BUILD = "enterprise-onboarding-theme-fix"') == 1
          text = text.replace('APP_VERSION = "1.0.6"', 'APP_VERSION = "1.0.7"')
          text = text.replace('APP_BUILD = "enterprise-onboarding-theme-fix"', 'APP_BUILD = "enterprise-lifeplanner-pipeline"')
          p.write_text(text, encoding="utf-8")

          c = Path("CHANGELOG.md")
          changelog = c.read_text(encoding="utf-8")
          prefix = "# Changelog\n\n"
          assert changelog.startswith(prefix)
          entry = (
              "## 1.0.7 — 2026-08-21\n\n"
              "- Release-Gate korrigiert: stabiler Build-Identifier `enterprise-lifeplanner-pipeline` wiederhergestellt.\n"
              "- Der Theme-Fix aus 1.0.6 bleibt unverändert enthalten.\n"
              "- Vollständige Windows- und Linux-Release-Gates laufen vor dem Tagging.\n\n"
          )
          c.write_text(prefix + entry + changelog[len(prefix):], encoding="utf-8")
          PY
          python tools/sync_version.py

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and install platform lock
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.lock_file }}"
          python tools/gen_lockfile.py --check --platform "${{ matrix.platform }}"
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r "${{ matrix.lock_file }}"

      - name: Run complete release gates before tagging
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_version.py --check
          python tools/check_windows_paths.py
          python tools/import_smoke.py
          python tools/name_audit.py
          python tools/exception_audit.py
          python tools/db_access_audit.py
          python -m compileall -q .
          python -m ruff check . --select E9,F63,F7,F82
          python -m bandit -q -r database logic ui updater main.py tools -x tests --severity-level medium
          python -m pytest -q --cov=logic --cov=database --cov=updater --cov-report=term --cov-fail-under=65
          python -m pytest -q tests/test_updater_behavior_0301.py tests/test_updater_enterprise_0304.py --cov=updater.check_update --cov=updater.apply_update --cov=updater.startup_check --cov-report=term --cov-fail-under=85
          python tools/gui_smoke_test.py
          python tools/i18n_audit.py
          python tools/i18n_quality_audit.py
          python tools/i18n_key_wiring_audit.py
          python tools/i18n_runtime_audit.py
          python tools/i18n_visible_text_audit.py
          python tools/killcritic_1000_loop_audit.py

  publish:
    name: Publish and verify v1.0.7
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Commit the already-gated 1.0.7 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.7 >/dev/null 2>&1; then
            echo "Tag v1.0.7 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          p = Path("app_info.py")
          text = p.read_text(encoding="utf-8")
          assert text.count('APP_VERSION = "1.0.6"') == 1
          assert text.count('APP_BUILD = "enterprise-onboarding-theme-fix"') == 1
          text = text.replace('APP_VERSION = "1.0.6"', 'APP_VERSION = "1.0.7"')
          text = text.replace('APP_BUILD = "enterprise-onboarding-theme-fix"', 'APP_BUILD = "enterprise-lifeplanner-pipeline"')
          p.write_text(text, encoding="utf-8")

          c = Path("CHANGELOG.md")
          changelog = c.read_text(encoding="utf-8")
          prefix = "# Changelog\n\n"
          assert changelog.startswith(prefix)
          entry = (
              "## 1.0.7 — 2026-08-21\n\n"
              "- Release-Gate korrigiert: stabiler Build-Identifier `enterprise-lifeplanner-pipeline` wiederhergestellt.\n"
              "- Der Theme-Fix aus 1.0.6 bleibt unverändert enthalten.\n"
              "- Vollständige Windows- und Linux-Release-Gates laufen vor dem Tagging.\n\n"
          )
          c.write_text(prefix + entry + changelog[len(prefix):], encoding="utf-8")
          PY
          python tools/sync_version.py
          python tools/sync_version.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app_info.py CHANGELOG.md \
            version.json VERSION_INFO.txt installer/FountainPenManager_Setup.iss \
            module.json latest.json.template docs/latest.json.template README.md \
            docs/WINDOWS_RELEASE_DE.md docs/WINDOWS_RELEASE_EN.md docs/WINDOWS_RELEASE_FR.md
          git diff --cached --check
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git commit -m "FPM 1.0.7: Release-Gate korrigiert"
          git push origin HEAD:main

      - name: Tag, dispatch and verify the canonical cross-platform release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          git tag v1.0.7
          git push origin v1.0.7
          gh workflow run windows-release.yml --ref v1.0.7

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow windows-release.yml --limit 40 --json databaseId,headSha,event --jq '.[] | select(.headSha == env.release_sha and .event == "workflow_dispatch") | .databaseId' 2>/dev/null | head -n1 || true)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          result_status="missing"
          conclusion="missing"
          release_url=""
          watch_rc=1
          if [ -n "$run_id" ]; then
            set +e
            gh run watch "$run_id" --exit-status --interval 10
            watch_rc=$?
            set -e
            result_status="$(gh run view "$run_id" --json status --jq '.status // "unknown"')"
            conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion // "unknown"')"
            release_url="$(gh run view "$run_id" --json url --jq '.url // ""')"
          fi

          git fetch origin fix/onboarding-theme-1.0.6
          git switch -C release-verification origin/fix/onboarding-theme-1.0.6
          mkdir -p .release
          printf 'status=%s\nconclusion=%s\nrun_id=%s\nversion=1.0.7\nsha=%s\nurl=%s\nwatch_rc=%s\n' \
            "$result_status" "$conclusion" "$run_id" "$release_sha" "$release_url" "$watch_rc" \
            > .release/v1.0.7-release-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .release/v1.0.7-release-status.txt
          git commit -m "Record FPM v1.0.7 release result"
          git push origin HEAD:fix/onboarding-theme-1.0.6

          test "$result_status" = "completed"
          test "$conclusion" = "success"
          test "$watch_rc" -eq 0
