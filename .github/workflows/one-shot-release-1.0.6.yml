name: Snapshot recent FPM workflow runs

on:
  push:
    branches:
      - fix/onboarding-theme-1.0.6
    paths-ignore:
      - '.release/recent-runs.json'
      - '.release/v1.0.7-release-status.txt'
      - '.release/v1.0.7-promote-status.txt'

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          gh run list --limit 30 --json databaseId,workflowName,status,conclusion,headSha,event,createdAt,url > .release/recent-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .release/recent-runs.json
          git commit -m "Snapshot recent FPM workflow runs"
          git push origin HEAD:fix/onboarding-theme-1.0.6
