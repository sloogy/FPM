name: Push-Gates

# Der Enterprise-Check laeuft nur bei Pull Requests, der volle Release-Lauf nur
# am Tag. Gearbeitet wird in dieser Suite aber direkt auf main - dort lief
# deshalb ueberhaupt nichts, und ein Fehler waere erst beim naechsten Release
# aufgefallen, zehn Arbeitsrunden spaeter.
#
# Dieser Lauf schliesst die Luecke, ohne das Doppellauf-Problem
# zurueckzubringen, das den Push-Trigger dort ausschloss: Er reagiert nur auf
# main, nie auf Tags, und macht nur die guenstigen Pruefungen - Linux, ein
# Python, keine Builds, keine Coverage-Schwellen. Zwei bis drei Minuten.
#
# Wortgleich aufgebaut in FPM, BudgetManager, FreizeitManager und LifePlanner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpm-push-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    # Release-Commits gehen ohnehin durch den vollen Lauf.
    if: "!startsWith(github.event.head_commit.message, '[release]')"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten mit Hash-Pruefung installieren
        run: |
          python -m pip install --upgrade pip
          python tools/gen_lockfile.py --check --platform linux
          python -m pip install --require-hashes --only-binary=:all: -r constraints-linux.lock

      - name: Version und Namen
        run: |
          python tools/sync_version.py --check
          python tools/check_windows_paths.py
          python tools/import_smoke.py
          python tools/name_audit.py
          python -m compileall -q .

      - name: Ratchets
        run: |
          python tools/exception_audit.py
          python tools/db_access_audit.py

      - name: Statische Analyse und Sicherheit
        run: |
          python -m ruff check . --select E9,F63,F7,F82
          python -m bandit -q -r database logic ui updater main.py tools -x tests --severity-level medium

      - name: Tests
        run: python -m pytest -q
