name: Enterprise Release Check

# Läuft bewusst nicht auf Push nach main: beim Release werden main und Tag
# zusammen gepusht, was sonst zwei parallele Läufe für denselben Stand ergibt.
# Die vollständigen Gates laufen im taggesteuerten Release-Workflow.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpm-enterprise-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Validate ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            lock_file: constraints-linux.lock
          - os: windows-latest
            platform: windows
            lock_file: constraints-windows.lock
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require and validate platform lock
        shell: bash
        run: |
          test -f "${{ matrix.lock_file }}"
          python tools/gen_lockfile.py --check --platform "${{ matrix.platform }}"

      - name: Install hash-locked dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary=:all: -r "${{ matrix.lock_file }}"

      - name: Version, path and import gates
        shell: bash
        run: |
          python tools/sync_version.py --check
          python tools/check_windows_paths.py
          python tools/import_smoke.py
          python tools/name_audit.py
          python tools/exception_audit.py
          python tools/db_access_audit.py
          python -m compileall -q .

      - name: Static and security analysis
        shell: bash
        run: |
          python -m ruff check . --select E9,F63,F7,F82
          python -m bandit -q -r database logic ui updater main.py tools -x tests --severity-level medium

      - name: Unit, regression and coverage gates
        shell: bash
        run: |
          python -m pytest -q --cov=logic --cov=database --cov=updater --cov-report=term --cov-fail-under=65
          python -m pytest -q tests/test_updater_behavior_0301.py tests/test_updater_enterprise_0304.py \
            --cov=updater.check_update --cov=updater.apply_update --cov=updater.startup_check --cov-report=term --cov-fail-under=85

      - name: GUI and localization gates
        shell: bash
        run: |
          python tools/gui_smoke_test.py
          python tools/i18n_audit.py
          python tools/i18n_quality_audit.py
          python tools/i18n_key_wiring_audit.py
          python tools/i18n_runtime_audit.py
          python tools/i18n_visible_text_audit.py

      - name: KILLCRITIC release audit
        shell: bash
        run: python tools/killcritic_1000_loop_audit.py
